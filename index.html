<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Touch of Water</title>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#05050a">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    #map { position: fixed; inset: 0; }

    /* Darken + desaturate satellite tiles */
    .leaflet-tile-pane { filter: brightness(0.42) saturate(0.55); }
    .leaflet-control-attribution { display: none; }

    /* Header */
    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      padding: 1.8rem 2rem 4rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.92) 0%, transparent 100%);
      pointer-events: none;
    }
    #header h1 {
      font-size: 2.1rem; letter-spacing: 0.22em; font-weight: 400;
    }
    #header .sub {
      font-size: 1rem; letter-spacing: 0.22em;
      color: rgba(255,255,255,0.32); text-transform: uppercase;
      margin-top: 0.5rem; line-height: 2.2;
    }

    /* Footer */
    #footer {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
      padding: 3.5rem 2rem 1.6rem;
      background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, transparent 100%);
      pointer-events: none;
    }
    #footer .credits {
      font-size: 0.9rem; letter-spacing: 0.18em;
      color: rgba(255,255,255,0.25); text-transform: uppercase; line-height: 2.4;
    }

    /* Popup */
    .leaflet-popup-content-wrapper {
      background: rgba(4,4,8,0.94) !important;
      border: 1px solid rgba(255,255,255,0.1) !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      color: #fff !important;
      font-family: 'Courier New', monospace !important;
      padding: 0 !important;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      padding: 1.2rem 1.5rem 1.3rem !important;
      min-width: 210px;
    }
    .leaflet-popup-tip-container { display: none; }
    .leaflet-popup-close-button {
      color: rgba(255,255,255,0.35) !important;
      top: 0.5rem !important; right: 0.6rem !important;
      font-size: 2rem !important;
    }

    .p-label { font-size: 1rem; letter-spacing: 0.25em; opacity: 0.3; text-transform: uppercase; }
    .p-name  { font-size: 1.8rem; letter-spacing: 0.1em; margin: 0.35rem 0 0.25rem; }
    .p-venue { font-size: 1.05rem; letter-spacing: 0.08em; opacity: 0.5; line-height: 1.7; }
    .p-date  { font-size: 1.05rem; letter-spacing: 0.08em; opacity: 0.38; margin: 0.3rem 0 0.6rem; }

    .p-btn {
      display: block; margin-top: 0.8rem;
      padding: 0.55rem 1rem;
      border: 1px solid rgba(255,255,255,0.22);
      background: transparent; color: #fff;
      font-family: 'Courier New', monospace; font-size: 1.1rem;
      letter-spacing: 0.22em; text-transform: uppercase;
      cursor: pointer; text-align: center; text-decoration: none;
      transition: border-color 0.2s;
    }
    .p-btn:hover { border-color: rgba(255,255,255,0.6); }

    /* Edition ripple markers */
    .dot-wrap { display: flex; align-items: center; justify-content: center; }
    .ripple {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .ripple .core {
      width: 12px; height: 12px; border-radius: 50%;
      background: #cfe8ff;
      box-shadow: 0 0 10px 3px rgba(116,192,252,0.7);
      z-index: 2;
    }
    .ripple .ring {
      position: absolute; inset: 0;
      border: 1.5px solid #74c0fc; border-radius: 50%;
      animation: ripple 2.8s ease-out infinite;
      opacity: 0;
    }
    .ripple .ring:nth-child(2) { animation-delay: 1.4s; }
    @keyframes ripple {
      0%   { transform: scale(0.3); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }
  </style>
</head>
<body>

<div id="header">
  <h1>Touch of Water</h1>
  <div class="sub">
    Memory-Mapping with AR and Sound Journal<br>
    Workshop Editions
  </div>
</div>

<div id="map"></div>

<div id="footer">
  <div class="credits">
    AR: Bin Youn &nbsp;·&nbsp; Digital Media, RMIT University Vietnam<br>
    Sound Journal: Van Luber Parensen &amp; Dyah Nindyasari · Sigisora, Jakarta, Indonesia<br>
    Workshop Coordinator: Prof. Suk-Jun Kim · University of Aberdeen
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', {
  center: [10, 105],
  zoom: 4,
  minZoom: 2,
  zoomControl: false,
  attributionControl: false,
  worldCopyJump: true
})

L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 20 }
).addTo(map)

fetch('./editions.json')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json() })
  .then(editions => {
    if (editions.length === 1) {
      map.setView([editions[0].lat, editions[0].lng], 5)
    } else if (editions.length > 1) {
      map.fitBounds(editions.map(e => [e.lat, e.lng]), {
        padding: [90, 90], maxZoom: 6
      })
    }

    editions.forEach((ed, i) => {
      const icon = L.divIcon({
        className: 'dot-wrap',
        iconSize:   [44, 44],
        iconAnchor: [22, 22],
        html: `<div class="ripple" style="width:44px;height:44px">
          <span class="ring"></span><span class="ring"></span>
          <span class="core"></span>
        </div>`
      })

      const num = String(i + 1).padStart(2, '0')
      const html = `
        <div class="p-label">Edition ${num} · ${ed.country}</div>
        <div class="p-name">${ed.name}</div>
        <div class="p-venue">${ed.venue}</div>
        <div class="p-date">${ed.date}</div>
        <a class="p-btn" href="map.html?edition=${ed.id}">Team Map →</a>
        <a class="p-btn" href="gallery.html?edition=${ed.id}">Documentation</a>`

      L.marker([ed.lat, ed.lng], { icon })
        .bindPopup(html, { maxWidth: 280 })
        .addTo(map)
    })
  })
  .catch(err => {
    console.error('editions.json failed:', err)
    document.body.insertAdjacentHTML('beforeend',
      `<div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#f66;font-family:monospace;font-size:1rem;z-index:9999">Could not load editions.json: ${err.message}</div>`)
  })
</script>
</body>
</html>

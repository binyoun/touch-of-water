<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Touch of Water · Workshop Documentation</title>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#05050a">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Courier New', monospace;
    }

    header {
      padding: 2.2rem 2rem 1.6rem;
    }
    header h1 {
      font-size: 1.6rem; letter-spacing: 0.22em; font-weight: 400;
    }
    header .sub {
      font-size: 0.85rem; letter-spacing: 0.22em;
      color: rgba(255,255,255,0.32); text-transform: uppercase;
      margin-top: 0.5rem; line-height: 2;
    }
    header a.back, header a.brief {
      display: inline-block; margin-top: 1rem; margin-right: 0.6rem;
      padding: 0.45rem 0.9rem;
      border: 1px solid rgba(255,255,255,0.22);
      color: #fff; text-decoration: none;
      font-size: 0.8rem; letter-spacing: 0.22em; text-transform: uppercase;
      transition: border-color 0.2s;
    }
    header a.back:hover, header a.brief:hover { border-color: rgba(255,255,255,0.6); }

    /* Poster */
    #poster {
      padding: 0.5rem 2rem 0.5rem;
      max-width: 420px;
    }
    #poster figure {
      cursor: pointer; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }
    #poster img {
      width: 100%; display: block;
      transition: filter 0.35s ease;
      filter: saturate(0.92);
    }
    #poster figure:hover img { filter: saturate(1); }
    #poster .caption {
      font-size: 0.78rem; letter-spacing: 0.2em;
      color: rgba(255,255,255,0.3); text-transform: uppercase;
      margin: 0.7rem 0 1rem; line-height: 1.8;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 6px;
      padding: 0.5rem 2rem 2rem;
    }
    #grid figure {
      position: relative; overflow: hidden;
      aspect-ratio: 16 / 10;
      background: #0a0a0e;
      cursor: pointer;
    }
    #grid img {
      width: 100%; height: 100%; object-fit: cover;
      display: block;
      filter: saturate(0.92);
      transition: transform 0.35s ease, filter 0.35s ease;
    }
    #grid figure:hover img {
      transform: scale(1.04);
      filter: saturate(1);
    }

    footer {
      padding: 1.5rem 2rem 2.2rem;
    }
    footer .credits {
      font-size: 0.78rem; letter-spacing: 0.18em;
      color: rgba(255,255,255,0.25); text-transform: uppercase; line-height: 2.4;
    }

    /* Lightbox */
    #lightbox {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(0,0,0,0.96);
      display: none;
      align-items: center; justify-content: center;
      flex-direction: column;
    }
    #lightbox.open { display: flex; }
    #lightbox img {
      max-width: 94vw; max-height: 86vh;
      object-fit: contain;
    }
    #lightbox .counter {
      margin-top: 1rem;
      font-size: 0.85rem; letter-spacing: 0.25em;
      color: rgba(255,255,255,0.4);
    }
    #lightbox .close {
      position: fixed; top: 1rem; right: 1.4rem;
      font-size: 2rem; color: rgba(255,255,255,0.5);
      cursor: pointer; background: none; border: none;
      font-family: 'Courier New', monospace;
    }
    #lightbox .nav {
      position: fixed; top: 50%; transform: translateY(-50%);
      font-size: 2.2rem; color: rgba(255,255,255,0.4);
      cursor: pointer; background: none; border: none;
      font-family: 'Courier New', monospace;
      padding: 1rem;
    }
    #lightbox .nav:hover, #lightbox .close:hover { color: #fff; }
    #lightbox .prev { left: 0.6rem; }
    #lightbox .next { right: 0.6rem; }
  </style>
</head>
<body>

<header>
  <h1>Touch of Water</h1>
  <div class="sub" id="sub">
    Workshop Documentation
  </div>
  <a class="back" id="back-link" href="map.html">← Map</a>
  <a class="brief" id="brief-link" href="#" target="_blank" rel="noopener" style="display:none">Workshop Brief (PDF)</a>
</header>

<div id="poster" style="display:none">
  <figure id="poster-fig">
    <img id="poster-img" alt="Touch of Water workshop poster">
  </figure>
  <div class="caption" id="poster-caption">Workshop Poster</div>
</div>

<div id="grid"></div>

<footer>
  <div class="credits" id="credits"></div>
</footer>

<div id="lightbox">
  <button class="close" aria-label="Close">×</button>
  <button class="nav prev" aria-label="Previous">‹</button>
  <img alt="Workshop photo enlarged">
  <button class="nav next" aria-label="Next">›</button>
  <div class="counter"></div>
</div>

<script type="module">
const rawEdition = new URLSearchParams(location.search).get('edition')
const requested  = /^[a-z0-9-]+$/i.test(rawEdition ?? '') ? rawEdition : null

const ITEMS = []
let hasPoster = false

const editions = await fetch('./editions.json').then(r => {
  if (!r.ok) throw new Error(r.status); return r.json()
})
const edition = editions.find(e => e.id === requested) ?? editions[0]
const base    = `editions/${edition.id}/`

document.title = `Touch of Water · ${edition.name} · Documentation`
document.getElementById('sub').innerHTML = `Workshop Documentation<br>${edition.sub}`
document.getElementById('credits').innerHTML = edition.credits.join('<br>')
document.getElementById('back-link').href = `map.html?edition=${edition.id}`

if (edition.brief) {
  const brief = document.getElementById('brief-link')
  brief.href = base + edition.brief
  brief.style.display = 'inline-block'
}

if (edition.poster) {
  hasPoster = true
  ITEMS.push(`${base}images/workshop/poster.jpg`)
  const posterImg = document.getElementById('poster-img')
  posterImg.src = ITEMS[0]
  posterImg.alt = `Touch of Water workshop poster, ${edition.name}, ${edition.date}`
  document.getElementById('poster-caption').textContent =
    `Workshop Poster · ${edition.venue}`
  document.getElementById('poster').style.display = 'block'
  document.getElementById('poster-fig').addEventListener('click', () => openLightbox(0))
}

const photoCount = edition.gallery?.count ?? 0
const prefix     = edition.gallery?.prefix ?? ''
for (let i = 1; i <= photoCount; i++) {
  ITEMS.push(`${base}images/workshop/${prefix}${String(i).padStart(2, '0')}.jpg`)
}

const grid = document.getElementById('grid')
const firstPhoto = hasPoster ? 1 : 0

for (let i = firstPhoto; i < ITEMS.length; i++) {
  const fig = document.createElement('figure')
  const n = i - firstPhoto + 1
  fig.innerHTML = `<img src="${ITEMS[i]}" loading="lazy"
    alt="Touch of Water workshop, ${edition.name}, photo ${n} of ${photoCount}">`
  fig.addEventListener('click', () => openLightbox(i))
  grid.appendChild(fig)
}

const lightbox = document.getElementById('lightbox')
const lbImg = lightbox.querySelector('img')
const lbCounter = lightbox.querySelector('.counter')
let current = 0

function openLightbox(i) {
  current = i
  render()
  lightbox.classList.add('open')
}
function render() {
  lbImg.src = ITEMS[current]
  lbCounter.textContent = (hasPoster && current === 0)
    ? 'Poster'
    : `${current - firstPhoto + 1} / ${photoCount}`
}
function step(d) {
  current = (current + d + ITEMS.length) % ITEMS.length
  render()
}

lightbox.querySelector('.close').addEventListener('click', () => lightbox.classList.remove('open'))
lightbox.querySelector('.prev').addEventListener('click', e => { e.stopPropagation(); step(-1) })
lightbox.querySelector('.next').addEventListener('click', e => { e.stopPropagation(); step(1) })
lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.classList.remove('open') })

document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) return
  if (e.key === 'Escape') lightbox.classList.remove('open')
  if (e.key === 'ArrowLeft') step(-1)
  if (e.key === 'ArrowRight') step(1)
})
</script>
</body>
</html>
